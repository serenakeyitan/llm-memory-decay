[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-memory-decay"
version = "0.1.0"
description = "Smart memory decay & forgetting for LLM personalization — stop stale memories from dominating context"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "memory", "personalization", "langchain", "openai", "decay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
    "mypy>=1.0",
]
all = ["langchain>=0.1.0", "openai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/serenakeyitan/llm-memory-decay"
Repository = "https://github.com/serenakeyitan/llm-memory-decay"
Issues = "https://github.com/serenakeyitan/llm-memory-decay/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_memory_decay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
